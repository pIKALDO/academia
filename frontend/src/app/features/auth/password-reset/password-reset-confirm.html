<div class="auth-screen">
  <div class="auth-panel">
    <h1 class="headline">Nueva contraseña</h1>

    @if (tokenMissing) {
      <p class="error-text">El enlace no es válido. Solicita uno nuevo.</p>
    } @else if (done()) {
      <p class="success-text">Contraseña actualizada. Redirigiendo al inicio de sesión…</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span class="label">Nueva contraseña</span>
          <input type="password" formControlName="newPassword" autocomplete="new-password" />
        </label>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </form>
    }

    <a class="link" routerLink="/login">Volver a iniciar sesión</a>
  </div>
</div>
