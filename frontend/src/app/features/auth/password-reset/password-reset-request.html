<div class="auth-screen">
  <div class="auth-panel">
    <h1 class="headline">Recuperar contraseña</h1>
    <p class="subtitle">Te enviaremos un enlace para restablecerla</p>

    @if (sent()) {
      <p class="success-text">
        Si esa dirección tiene una cuenta, hemos enviado un enlace de recuperación.
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span class="label">Correo electrónico</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>
    }

    <a class="link" routerLink="/login">Volver a iniciar sesión</a>
  </div>
</div>
