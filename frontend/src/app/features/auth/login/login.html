<div class="auth-screen">
  <div class="auth-panel">
    <h1 class="headline">Academia</h1>
    <p class="subtitle">Accede a tu panel de gestión</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span class="label">Correo electrónico</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="field">
        <span class="label">Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (invalidCredentials()) {
        <p class="error-text">Correo o contraseña incorrectos.</p>
      }

      <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Accediendo…' : 'Iniciar sesión' }}
      </button>
    </form>

    <a class="link" routerLink="/password-reset">¿Has olvidado tu contraseña?</a>
  </div>
</div>
