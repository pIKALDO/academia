<div class="page">
  <header class="topbar">
    <span class="brand">Academia</span>
    <div class="user-info">
      @if (user(); as u) {
        <span class="user-name">{{ u.displayName }}</span>
        <span class="user-role">{{ u.role }}</span>
      }
      <button type="button" class="btn-ghost" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="content">
    @if (user(); as u) {
      <h1 class="headline">Hola, {{ u.displayName }}</h1>
      <p class="subtitle">Todavía no hay nada que mostrar aquí.</p>
    }
  </main>
</div>
