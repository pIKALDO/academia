# Configuración común a todos los perfiles. Nada de secretos aquí: van por variable de
# entorno (ver application-local.yml para desarrollo y el perfil de servidor, aún no creado).
spring:
  application:
    name: academia-backend

  jpa:
    # Regla no negociable: el esquema lo define Flyway, nunca Hibernate.
    hibernate:
      ddl-auto: validate
    # Evita que la sesión de Hibernate quede abierta durante el renderizado de la vista.
    # Aquí no hay vistas server-side (la API es JSON puro), pero dejarlo en `true` esconde
    # querys N+1 que solo se disparan al serializar la respuesta.
    open-in-view: false
    properties:
      hibernate:
        # Las columnas TIMESTAMPTZ se comparan siempre en UTC, sin depender de la zona
        # horaria del servidor donde corra la aplicación.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    placeholders:
      # Nombre del rol de aplicación que usan los GRANT/REVOKE de V6__app_role.sql. No es un
      # secreto (solo la contraseña lo es, y esa nunca pasa por una migración): se define
      # aquí, no en application-local.yml, para que esté disponible también cuando Flyway
      # corre en el perfil por defecto (tests con Testcontainers).
      appDbUser: ${POSTGRES_APP_USER:academia_app}

  servlet:
    multipart:
      # Límite de subida de documentos (docs/diseno-api.md sección 5.7). Superarlo se
      # traduce en 413 desde GlobalExceptionHandler.
      max-file-size: 10MB
      max-request-size: 10MB

  # En application.yml (común) y no solo en application-local.yml: hace falta también en los
  # tests con Testcontainers (perfil por defecto), aunque no haya ningún Mailpit escuchando
  # ahí. Sin spring.mail.host no existe el bean JavaMailSender y el arranque falla por falta
  # de dependencia (AuthMailService la necesita); con el bean presente pero sin servidor SMTP
  # real, el intento de envío falla en tiempo de ejecución y AuthMailService ya lo captura y
  # registra sin tumbar la petición.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  servlet:
    session:
      cookie:
        # Nombre de cookie explícito: es el que documenta docs/diseno-api.md sección 2.1
        # (por defecto el contenedor usaría JSESSIONID).
        name: SESSION
        http-only: true
        same-site: strict
        # Solo viaja por HTTPS. En application-local.yml se relaja porque el desarrollo
        # local no sirve por TLS; en cualquier otro perfil se mantiene en true.
        secure: true
  error:
    # Nunca exponer mensaje, stacktrace ni detalles de binding: todo pasa por
    # GlobalExceptionHandler con ProblemDetail (regla no negociable nº6).
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Sin esto, /actuator/health depende de que Mailpit esté arriba: un correo de aviso que
    # no se pudo enviar ya se registra y se ignora (AuthMailService), así que tampoco tiene
    # sentido que tumbe el healthcheck del propio servicio.
    mail:
      enabled: false

springdoc:
  # Ordena alfabéticamente todas las claves del JSON (paths, esquemas, propiedades,
  # respuestas). Sin esto, springdoc emite los paths en el orden en que registra los
  # controladores, y añadir un endpoint reordena los existentes: el diff de
  # docs/openapi.json en la pull request mezcla cambios reales con movimientos.
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Base del front (Angular), para construir los enlaces de los correos de activación y
  # recuperación de contraseña. Sin perfil de servidor todavía: el valor de producción
  # llegará cuando exista.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@academia.local}
