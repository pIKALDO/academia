# Perfil de desarrollo local, contra la infraestructura de docker-compose.yml.
#
# Los valores por defecto (`:-`) coinciden con los de docker-compose.yml para que
# `docker compose up -d` + `mvn spring-boot:run -Dspring-boot.run.profiles=local` funcione
# sin configurar nada más. Son credenciales de desarrollo, no secretos reales: para
# sobrescribirlas basta con exportar la variable de entorno correspondiente.
server:
  servlet:
    session:
      cookie:
        # Local corre sobre http://localhost, sin TLS: con secure=true el navegador
        # descartaría la cookie de sesión y el login no funcionaría nunca en desarrollo.
        secure: false

spring:
  datasource:
    # Rol de aplicación: sin propiedad sobre las tablas, sin permiso de UPDATE/DELETE en
    # audit_log (V6__app_role.sql). Es el que usa Hibernate/JdbcTemplate en tiempo de
    # ejecución; nunca el propietario que ejecuta las migraciones.
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:academia}
    username: ${POSTGRES_APP_USER:academia_app}
    password: ${POSTGRES_APP_PASSWORD:academia_app_dev}

  flyway:
    # Rol propietario: el único que ejecuta las migraciones, incluidos los GRANT/REVOKE de
    # V6 sobre el rol de aplicación. Credenciales propias porque spring.datasource.* ya no
    # le pertenece a este rol.
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:academia}
    user: ${POSTGRES_USER:academia}
    password: ${POSTGRES_PASSWORD:academia_dev}

app:
  admin:
    # Sin valor por defecto, a propósito (LocalAdminBootstrapper): si ADMIN_EMAIL/ADMIN_PASSWORD
    # no están exportadas, el arranque falla en vez de crear un admin con una contraseña fija
    # conocida por cualquiera que lea este fichero.
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  seed:
    # Datos de demostración (LocalDemoDataSeeder). Vacía por defecto, y entonces el seed se
    # omite: a diferencia del admin, sin estos datos el backend sigue siendo usable.
    family-password: ${SEED_FAMILY_PASSWORD:}

logging:
  level:
    com.academia: DEBUG
    org.flywaydb: INFO
