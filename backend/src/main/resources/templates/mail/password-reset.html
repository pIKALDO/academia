<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Recupera tu contraseña</title>
</head>
<body style="font-family: sans-serif; color: #1a1a1a;">
    <p>Hola <span th:text="${displayName}">nombre</span>,</p>

    <p>Hemos recibido una solicitud para restablecer tu contraseña. Si has sido tú, entra en
        el siguiente enlace para elegir una nueva:</p>

    <p>
        <a th:href="${actionUrl}" href="#">Restablecer contraseña</a>
    </p>

    <p>Si no has solicitado este cambio, puedes ignorar este correo: tu contraseña actual
        sigue siendo válida.</p>
</body>
</html>
